<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- Badge fuer Web-Push (Statusleiste). Es zaehlt NUR die Alpha-Maske,
       das System faerbt die Form ein -> weiss auf transparent, kein Hintergrund.
       Inhalt fuellt bewusst nur ~66 % der Kantenlaenge: manche Systeme stanzen
       den Badge kreisrund aus, randlose Ziffern werden dabei abgeschnitten. -->
  <text x="48" y="66" font-family="DejaVu Sans, Arial Black, Arial, Helvetica, sans-serif"
        font-size="49" font-weight="bold" fill="#ffffff" stroke="#ffffff" stroke-width="3"
        stroke-linejoin="round" text-anchor="middle" textLength="63"
        lengthAdjust="spacingAndGlyphs">28</text>
</svg>
