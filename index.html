<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Public+Sans:wght@400;500;600;700&display=swap"
    />
    <title>Stufenkasse</title>
  </head>
  <body>
    <div id="root"></div>
    <!--
      Notausgang gegen die weiße Seite: Ist nach 8 Sekunden noch nichts zu sehen
      (meist hängt ein alter Zwischenspeicher nach einem Update), erscheint ein
      Knopf, der den Speicher der App leert und neu lädt. Anmeldung und Daten
      bleiben dabei erhalten – es werden nur die Programmdateien neu geholt.
    -->
    <script>
      setTimeout(function () {
        var root = document.getElementById("root");
        if (!root || root.children.length) return;
        root.innerHTML =
          '<div style="font-family:system-ui,sans-serif;max-width:22rem;margin:18vh auto;padding:1.5rem;text-align:center">' +
          '<div style="font-size:2rem">🔄</div>' +
          '<p style="font-weight:700;margin:.5rem 0">Die App lädt nicht richtig.</p>' +
          '<p style="font-size:.9rem;color:#666;margin:0 0 1rem">Meist hängt noch eine alte Version im Speicher. Ein Tipp behebt das.</p>' +
          '<button id="sv-rettung" style="background:#4f46e5;color:#fff;border:0;border-radius:.75rem;padding:.8rem 1.2rem;font-weight:700;font-size:1rem">Neu laden</button></div>';
        document.getElementById("sv-rettung").onclick = function () {
          var fertig = function () { location.reload(); };
          var sw = navigator.serviceWorker ? navigator.serviceWorker.getRegistrations().then(function (r) { return Promise.all(r.map(function (x) { return x.unregister(); })); }) : Promise.resolve();
          var cs = window.caches ? caches.keys().then(function (k) { return Promise.all(k.map(function (x) { return caches.delete(x); })); }) : Promise.resolve();
          Promise.all([sw, cs]).then(fertig, fertig);
        };
      }, 8000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
