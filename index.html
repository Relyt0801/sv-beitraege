<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Schriften kommen aus dem eigenen Build (src/main.tsx, @fontsource), nicht von Google -->
    <title>Stufenkasse</title>
  </head>
  <body>
    <div id="root"></div>
    <!--
      Notausgang gegen die weiße Seite: Ist nach 8 Sekunden noch nichts zu sehen
      (meist hängt ein alter Zwischenspeicher nach einem Update), erscheint ein
      Knopf, der den Speicher der App leert und neu lädt. Anmeldung und Daten
      bleiben dabei erhalten – es werden nur die Programmdateien neu geholt.
    -->
    <script>
      setTimeout(function () {
        var root = document.getElementById("root");
        if (!root || root.children.length) return;
        root.innerHTML =
          '<div style="font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;max-width:22rem;margin:18vh auto;padding:1.5rem;text-align:center">' +
          '<div style="font-size:2rem">🔄</div>' +
          '<p style="font-weight:700;margin:.5rem 0">Die App lädt nicht richtig.</p>' +
          '<p style="font-size:.9rem;color:#666;margin:0 0 1rem">Meist hängt noch eine alte Version im Speicher. Ein Tipp behebt das.</p>' +
          '<button id="sv-rettung" style="background:#0071e3;color:#fff;border:0;border-radius:999px;padding:.8rem 1.4rem;font-weight:600;font-size:1rem">Neu laden</button></div>';
        document.getElementById("sv-rettung").onclick = function () {
          var fertig = function () { location.reload(); };
          var sw = navigator.serviceWorker ? navigator.serviceWorker.getRegistrations().then(function (r) { return Promise.all(r.map(function (x) { return x.unregister(); })); }) : Promise.resolve();
          var cs = window.caches ? caches.keys().then(function (k) { return Promise.all(k.map(function (x) { return caches.delete(x); })); }) : Promise.resolve();
          Promise.all([sw, cs]).then(fertig, fertig);
        };
      }, 8000);
    </script>
    <!--
      Chrome, Edge und Samsung Internet melden sehr früh, dass die Seite
      installierbar ist – oft bevor React überhaupt läuft. Deshalb wird das
      Ereignis schon hier abgefangen und aufgehoben; ohne das wäre der Knopf
      "App installieren" beim ersten Öffnen tot.
      Safari auf iPhone/iPad kennt dieses Ereignis nicht, dort führt die App
      stattdessen durch "Teilen -> Zum Home-Bildschirm".
    -->
    <script>
      window.addEventListener("beforeinstallprompt", function (e) {
        e.preventDefault();
        window.__svInstall = e;
        window.dispatchEvent(new Event("sv:installierbar"));
      });
      window.addEventListener("appinstalled", function () {
        window.__svInstall = null;
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
